              <p class="text-lg leading-relaxed text-muted md:text-xl">${text}</p>
              <dl class="grid grid-cols-2 gap-4">
                ${p.facts.map(f => `<div class="rounded-xl border border-border/50 bg-card/40 backdrop-blur-md p-5 hover:border-primary/50 transition-colors"><dt class="font-mono text-xs uppercase text-muted">${t(f.k)}</dt><dd class="mt-2 text-sm font-bold text-foreground">${t(f.v)}</dd></div>`).join('')}
              </dl>
            </div>
          </div>
        </section>`;
      }

      function renderServices() {
        return `
        <section id="services" class="scroll-mt-24 border-t border-border/20 py-24 reveal">
          <div class="mx-auto max-w-6xl px-6">
            ${secTitle('02', {en: 'Core Services', ar: 'الخدمات الأساسية'})}
            <div class="mt-14 grid gap-6 md:grid-cols-3">
              ${CONFIG.services.map(s => `<div class="rounded-2xl border border-border/50 bg-card/40 backdrop-blur-md p-8 hover:border-primary/60 hover:-translate-y-2 transition-all"><div class="mb-6 inline-flex rounded-xl bg-primary/10 p-4 text-primary">${icon(s.icon, 'w-7 h-7')}</div><h3 class="text-xl font-bold mb-4">${t(s.title)}</h3><p class="text-sm text-muted">${t(s.desc)}</p></div>`).join('')}
            </div>
          </div>
        </section>`;
      }

      function renderCerts() {
        return `
        <section id="certs" class="scroll-mt-24 border-t border-border/20 py-24 reveal">
          <div class="mx-auto max-w-6xl px-6">
            ${secTitle('03', {en: 'Certifications', ar: 'الشهادات والتدريبات'})}
            <div class="mt-14 grid gap-4 md:grid-cols-3">
              ${CONFIG.certifications.map(c => `<div class="flex items-center gap-4 rounded-xl border border-border/40 bg-card/40 backdrop-blur-md p-5 hover:border-accent/50 transition-colors"><div class="text-accent bg-accent/10 p-3 rounded-lg">${icon(c.icon)}</div><div><h4 class="font-bold text-sm">${c.title}</h4><p class="text-xs text-muted font-mono mt-1">${c.issuer} • ${c.date}</p></div></div>`).join('')}
            </div>
          </div>
        </section>`;
      }

      function renderSkills() {
        return `
        <section id="skills" class="scroll-mt-24 border-t border-border/20 py-24 reveal">
          <div class="mx-auto max-w-6xl px-6">
            ${secTitle('04', {en: 'Technical Skills', ar: 'المهارات التقنية'})}
            <div class="mt-14 grid gap-6 md:grid-cols-3">
              ${CONFIG.skillGroups.map(g => `<div class="rounded-2xl border border-border/50 bg-card/40 backdrop-blur-md p-8 hover:border-accent/40 transition-colors"><div class="flex items-center gap-4 mb-6"><span class="text-accent bg-accent/10 p-2 rounded-lg">${icon(g.icon)}</span><h3 class="font-mono text-sm font-bold uppercase">${t(g.label)}</h3></div><ul class="flex flex-wrap gap-2.5">${g.items.map(i => `<li class="rounded-lg border border-border/60 bg-background/50 px-3 py-1 font-mono text-xs text-muted">${i}</li>`).join('')}</ul></div>`).join('')}
            </div>
          </div>
        </section>`;
      }

      function renderProjectsHTML() {
        const enFilter = activeFilter === 'الكل' ? 'All' : (activeFilter === 'محاكاة الهجمات' ? 'Red Teaming' : (activeFilter === 'اختبار البرمجيات' ? 'Software Testing' : activeFilter));
        const filtered = CONFIG.projects.filter(p => enFilter === 'All' || p.category.includes(enFilter));
        return filtered.map(pr => `
          <div class="group flex flex-col rounded-2xl border border-border/50 bg-card/40 backdrop-blur-md p-8 transition-all hover:-translate-y-2 hover:border-primary/50">
            <div class="inline-flex rounded-xl bg-primary/10 p-3.5 text-primary mb-6 w-fit">${icon(pr.icon)}</div>
            <h3 class="text-xl font-bold mb-3">${t(pr.title)}</h3>
            <p class="text-sm text-muted mb-6 flex-grow">${t(pr.desc)}</p>
            <div class="flex flex-wrap gap-2 pt-4 border-t border-border/30">${pr.tags.map(t => `<span class="rounded-md bg-background px-2.5 py-1 font-mono text-[11px] text-muted border border-border/30">${t}</span>`).join('')}</div>
          </div>`).join('');
      }

      window.setFilter = function(tagIndex) {
        const englishCategories = CONFIG.categories.en;
        const translatedCategories = t(CONFIG.categories);
        activeFilter = englishCategories[tagIndex];
        
        document.querySelectorAll('.filter-btn').forEach((btn, i) => {
          btn.classList.toggle('bg-primary', i === tagIndex);
          btn.classList.toggle('text-background', i === tagIndex);
          btn.classList.toggle('bg-card/50', i !== tagIndex);
          btn.classList.toggle('text-muted', i !== tagIndex);
        });
        document.getElementById('projectsGrid').innerHTML = renderProjectsHTML();
      }

      function renderProjectsSec() {
        const cats = t(CONFIG.categories);
        const btns = cats.map((c, i) => `<button onclick="setFilter(${i})" class="filter-btn px-4 py-2 rounded-lg font-mono text-sm font-bold border border-border/50 transition-colors ${i===0 ? 'bg-primary text-background' : 'bg-card/50 text-muted hover:border-primary/50'}">${c}</button>`).join('');
        return `
        <section id="projects" class="scroll-mt-24 border-t border-border/20 py-24 reveal">
          <div class="mx-auto max-w-6xl px-6">
            ${secTitle('05', {en: 'Projects & Labs', ar: 'المشاريع والمعامل'})}
            <div class="mt-8 flex flex-wrap gap-3">${btns}</div>
            <div id="projectsGrid" class="mt-10 grid gap-6 md:grid-cols-3">${renderProjectsHTML()}</div>
          </div>
        </section>`;
      }

      function renderContact() {
        const inpCls = 'w-full rounded-lg border border-border/60 bg-background/50 px-4 py-3 font-mono text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20';
        return `
        <footer id="contact" class="scroll-mt-24 border-t border-border/20 py-24 reveal relative">
          <div class="mx-auto max-w-5xl px-6 relative">
            ${secTitle('06', {en: 'Get in Touch', ar: 'تواصل معي'})}
            <div class="mt-14 grid gap-12 lg:grid-cols-[1.3fr_1fr]">
              <div class="rounded-2xl border border-border/50 bg-card/60 backdrop-blur-md p-8 shadow-xl">
                <form id="contactForm" class="flex flex-col gap-6" onsubmit="event.preventDefault(); showToast('${t({en: 'Message Transmitted!', ar: 'تم الإرسال بنجاح!'})}'); this.reset();">
                  <input required placeholder="${t({en: 'Name', ar: 'الاسم'})}" class="${inpCls}" />
                  <textarea required rows="4" placeholder="${t({en: 'Project Details...', ar: 'تفاصيل المشروع...'})}" class="${inpCls} resize-none"></textarea>
                  <button type="submit" class="rounded-lg bg-primary px-8 py-4 font-mono text-sm font-bold text-background hover:scale-[1.02] transition-transform">
                    ${t({en: 'Transmit Request', ar: 'إرسال الطلب'})}
                  </button>
                </form>
              </div>
              <div class="flex flex-col gap-4">
                ${CONFIG.socials.map(s => `<a href="${s.href}" ${linkAttrs(s.href)} ${s.copyable ? `onclick="handleCopy(event, '${s.value}')"` : ''} class="flex items-center gap-4 rounded-xl border border-border/40 bg-card/30 backdrop-blur-md px-5 py-4 hover:border-primary/50 transition-colors"><span class="bg-accent/10 text-accent p-2 rounded-lg">${icon(s.icon)}</span><span class="flex flex-col"><span class="font-mono text-xs text-muted">${s.label}</span><span class="text-sm font-bold hover:text-primary transition-colors">${s.value}</span></span></a>`).join('')}
              </div>
            </div>
          </div>
        </footer>`;
      }

      window.toggleLang = () => {
        lang = lang === 'en' ? 'ar' : 'en';
        localStorage.setItem('lang', lang);
        initPage();
      };

      function initPage() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        if(lang === 'ar') document.body.classList.add('font-cairo'); else document.body.classList.remove('font-cairo');
        
        document.getElementById('app').innerHTML = renderNav() + '<main>' + renderHero() + renderAbout() + renderServices() + renderCerts() + renderSkills() + renderProjectsSec() + '</main>' + renderContact();
        
        const isDark = document.documentElement.classList.contains('dark');
        document.getElementById('themeToggle').innerHTML = icon(isDark ? 'sun' : 'moon');
        document.getElementById('themeToggle').onclick = () => {
          document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
          initPage();
        };

        new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active') })).observe(document.querySelector('.reveal'));
        document.querySelectorAll('.reveal').forEach(el => new IntersectionObserver(e => e.forEach(en => {if(en.isIntersecting) en.target.classList.add('active')})).observe(el));

        const tw = document.getElementById('typewriter');
        let text = t(CONFIG.person.role), i = 0;
        tw.innerHTML = '';
        clearInterval(window.twInterval);
        window.twInterval = setInterval(() => { if(i < text.length) tw.innerHTML += text.charAt(i++); else clearInterval(window.twInterval); }, 50);
      }

      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      initPage();
    </script>
  </body>
</html>
